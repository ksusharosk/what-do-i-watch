spring.profiles.active=local

# TMDB
tmdb.api-key=${TMDB_API_KEY:}

# AI backend selection and keys
ai.backend=${AI_backend:ollama}
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ai.ollama.model=${OLLAMA_MODEL:llama3.1}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/whatiwatch}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# Encryption
encryption.password=${ENCRYPTION_PASSWORD:}
encryption.salt=${ENCRYPTION_SALT:}